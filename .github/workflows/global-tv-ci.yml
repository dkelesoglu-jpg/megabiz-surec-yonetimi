name: Global TV — CI

# Her PR/push: analiz, birim/widget testleri, veritabanı kural testleri, test APK'sı.
# Elle (workflow_dispatch): Android emülatöründe ve iOS simülatöründe uçtan uca test.
on:
  pull_request:
    paths: ['global-tv/**', '.github/workflows/global-tv-ci.yml']
  push:
    branches: [main, 'claude/global-tv-**']
    paths: ['global-tv/**', '.github/workflows/global-tv-ci.yml']
  workflow_dispatch:
    inputs:
      android_emulator:
        description: 'Android emülatöründe uçtan uca test'
        type: boolean
        default: true
      ios_simulator:
        description: 'iOS simülatöründe derleme + uçtan uca test (macOS dakikası harcar)'
        type: boolean
        default: false

# Aynı dala art arda gönderimde eski çalışma iptal edilir (Actions dakikası tasarrufu).
# Elle tetiklenen cihaz testleri iptal edilmez.
concurrency:
  group: global-tv-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# En az yetki: iş akışı depoya yalnızca okuma erişimiyle çalışır.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  flutter:
    name: Analiz + testler
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-tv/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  secrets:
    name: Gizli anahtar taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (global-tv klasörü)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir global-tv --redact --exit-code 1

  database:
    name: Veritabanı kuralları (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: global-tv/supabase/tests/run_pg_tests.sh
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions tip kontrolü
        working-directory: global-tv/supabase/functions
        run: deno check get-stream/index.ts delete-account/index.ts

  supabase-stack:
    name: Gerçek Supabase yığını (kimlik, RLS, sohbet, Realtime, Edge Functions)
    # Supabase'in kendi sunucu yazılımı CI içinde çalışır: hesap, proje veya ücret gerekmez.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Yığını başlat (migration'lar + demo veri)
        working-directory: global-tv
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta
      - name: Edge Functions'ı başlat
        working-directory: global-tv
        run: |
          supabase status -o env | sed -e 's/^/SB_/' -e 's/="\(.*\)"$/=\1/' >> "$GITHUB_ENV"
          nohup supabase functions serve > "$RUNNER_TEMP/functions.log" 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/get-stream -d '{}' || true)
            [ "$code" = "400" ] && exit 0
            sleep 3
          done
          cat "$RUNNER_TEMP/functions.log"; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-tv/supabase/remote-tests/package-lock.json
      - name: Sunucu güvenlik testleri
        working-directory: global-tv/supabase/remote-tests
        run: |
          npm ci
          npm test
        env:
          SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SB_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SB_SECRET_KEY }}
          GLOBALTV_REMOTE_TESTS: '1'
          GLOBALTV_TEST_FUNCTIONS: '1'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Uygulamanın Supabase depoları gerçek sunucuya karşı
        working-directory: global-tv/app
        run: |
          flutter pub get
          flutter gen-l10n
          flutter test test_remote
        env:
          SUPABASE_URL: ${{ env.SB_API_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ env.SB_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ env.SB_SECRET_KEY }}
          GLOBALTV_REMOTE_TESTS: '1'
      - name: Hata durumunda sunucu günlükleri
        if: failure()
        run: |
          cat "$RUNNER_TEMP/functions.log" || true
          docker ps -a --format '{{.Names}}' | grep supabase_ | xargs -r -I{} sh -c 'echo "== {}"; docker logs --tail 50 {}'

  admin:
    name: Yönetim paneli (tip, birim, uçtan uca)
    # Playwright 1.56 ubuntu-latest'in yeni sürümünü (26.04) desteklemiyor; 2 Kasım 2026'da CI'da düştü.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: global-tv/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: global-tv/admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'

  android-apk:
    name: Test APK'sı (staging, demo veri)
    needs: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global-tv/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Gizli anahtar içermez: Supabase değerleri boş → uygulama demo modunda açılır.
      - run: cp ../env/staging.example.json ../env/staging.json
      - run: flutter build apk --release --dart-define-from-file=../env/staging.json
      - uses: actions/upload-artifact@v4
        with:
          name: globaltv-staging-demo-apk-${{ github.run_number }}
          path: global-tv/app/build/app/outputs/flutter-apk/app-release.apk
          # Her gönderimin APK'sı 7 gün; elle tetiklenen (cihaz testi yapılan) sürüm adayları 30 gün saklanır.
          # Gizli depoda 500 MB depolama kotası: 27 MB × ~15 APK sınırında kalır.
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 30 || 7 }}

  android-emulator:
    name: Android emülatör — uçtan uca
    if: github.event_name == 'workflow_dispatch' && inputs.android_emulator
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KVM etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: cd global-tv/app && flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: global-tv/app
          script: flutter test integration_test

  ios-simulator:
    name: iOS simülatör — derleme + uçtan uca
    if: github.event_name == 'workflow_dispatch' && inputs.ios_simulator
    needs: flutter
    runs-on: macos-latest
    defaults:
      run:
        working-directory: global-tv/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Simülatörü başlat ve test et
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
